<h1 class="sr-only">Find the BusterElectric EV charging station</h1>
<div class="locator" data-locator>
  <section class="locator-panel" aria-label="Search and results">
    <div class="locator-search">
      <form class="locator-form" data-search-form role="search">
        <label for="loc-q">How far is it from you?</label>
        <div class="finder-row">
          <input class="input" id="loc-q" name="q" type="search" inputmode="search" placeholder="City, ZIP code or address" autocomplete="postal-code">
          <button class="btn btn-primary" type="submit" aria-label="Search">{{icon:search}}</button>
        </div>
      </form>
      <button class="btn btn-outline btn-block locate-btn" type="button" data-locate>{{icon:locate}}Use my location</button>

      <p class="locator-status" role="status" aria-live="polite" data-status></p>
    </div>
    <p class="locator-notice">For live charger status, open the <a href="{{partner.appUrl}}" target="_blank" rel="noopener">{{partner.name}} app</a>.</p>
    <ol class="results" data-results aria-label="Charging stations"></ol>
  </section>
  <div class="locator-map" aria-label="Map of charging stations">
    <div id="map" data-map></div>
    <noscript><p class="map-noscript">Turn on JavaScript to see the station map.</p></noscript>
  </div>
</div>
